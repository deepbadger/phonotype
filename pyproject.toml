[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "phonotype"
version = "2.0.0"  # bumped by release.sh
description = "Voice typing for Linux: dictate into any app (whisper.cpp / Parakeet), with optional LLM clean-up"
authors = [{ name = "Dmitry" }]  # based on VOXD by Jakov Ivkovic (MIT), see LICENSE
requires-python = ">=3.12"
dependencies = [
  "sounddevice>=0.5",
  "pyqt6>=6.9",
  "platformdirs>=4.2",
  "pyyaml>=6.0",
  "pyperclip>=1.9",
  "psutil>=5.9",
  "numpy>=1.26",
  "requests>=2.28.0",
  "PySocks>=1.7",
  "tqdm>=4.66"
]

[project.optional-dependencies]
gigachat = ["langchain-gigachat>=0.3"]


[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["whisper.cpp","venv",".venv","build","dist"]

[project.scripts]
phonotype = "phonotype.__main__:main"
phonotype-model = "phonotype.models:_cli"

[tool.hatch.build]
package-dir = "src"
include = ["setup.sh","src/phonotype/assets/*.png","src/phonotype/defaults/*.yaml"]

[tool.hatch.build.targets.wheel]
packages = ["src/phonotype"]

[tool.hatch.build.targets.editable]
packages = ["src/phonotype"]
