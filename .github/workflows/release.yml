name: Release

on:
  # Pushing a tag like v2.0.0 publishes that release. A tag with a pre-release
  # suffix (v2.1.0-rc1) is marked as a GitHub prerelease.
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the release
  actions: write    # dispatch the gigachat-bundle workflow

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      # No build artefacts: the Gentoo ebuild installs from the tag's source
      # archive, which GitHub generates on its own.
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VOXD ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger gigachat wheels bundle
        # Events raised with GITHUB_TOKEN do not cascade to other workflows, so
        # the bundle's "release: published" trigger never fires on its own.
        # Dispatch it for the same tag; it attaches the offline wheels archive
        # (used by the ebuild with USE=gigachat) to this release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run gigachat-bundle.yml \
            --repo "${{ github.repository }}" \
            -f tag="${{ github.ref_name }}"
